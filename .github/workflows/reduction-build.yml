name: Reduction branch build
on:
  push:
    branches: [reduction-dod-20261111]
  pull_request:
    branches: [main]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build git python3 glslang-tools             libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libvulkan-dev
      - name: Install c-buildsystem
        run: |
          git clone --depth 1 https://github.com/xt9y/build.c.git /tmp/c-buildsystem
          make -C /tmp/c-buildsystem -j2
          sudo make -C /tmp/c-buildsystem install
      - name: Compile server
        run: c build vulkan-server
      - name: Compile client
        run: c build vulkan-client
